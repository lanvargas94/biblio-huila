<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BiblioHuila</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { color: #14532d; } table { width: 100%; border-collapse: collapse; } td, th { padding: .4rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0; } input, select, button { padding: .45rem; font: inherit; }
    button { background: #166534; color: #fff; border: 0; border-radius: 6px; cursor: pointer; } #msg { min-height: 1.4rem; }
  </style>
</head>
<body>
  <h1>BiblioHuila · préstamos</h1>
  <h2>Libros</h2>
  <table><thead><tr><th>#</th><th>Título</th><th>Autor</th><th>Ejemplares</th></tr></thead><tbody id="libros"></tbody></table>
  <h2>Prestar un libro</h2>
  <form id="form">
    <input id="lector" placeholder="Nombre del lector" required>
    <select id="libro"></select>
    <button>Prestar</button>
  </form>
  <p id="msg"></p>
  <h2>Préstamos</h2>
  <table><thead><tr><th>#</th><th>Libro</th><th>Lector</th><th>Vence</th><th>Estado</th></tr></thead><tbody id="prestamos"></tbody></table>
  <script src="app.js"></script>
</body>
</html>
